global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "cyberplat_app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  - job_name: "cyberplat_worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]

