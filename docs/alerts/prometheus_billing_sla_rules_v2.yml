groups:
  - name: billing-sla-v2
    rules:
      - alert: BillingJobsQueueHighPending
        expr: billing_jobs_queue_depth{status="pending"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Billing jobs pending queue is high"
          description: "billing_jobs_queue_depth{status=\"pending\"} > 100 for 10m"

      - alert: UsageInvoiceTimeToPaidP95High
        expr: histogram_quantile(0.95, sum(rate(usage_invoice_time_to_paid_seconds_bucket[30m])) by (le)) > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Time-to-paid p95 is high"
          description: "p95(usage_invoice_time_to_paid_seconds) > 300s for 15m"

      - alert: BillingJobFailuresSpike
        expr: sum(rate(billing_jobs_failure_reasons_total[10m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Billing job failures spike"
          description: "Failure reasons rate > 1 in last 10m"

      - alert: UsageInvoiceConversionDropProcessingToPaid
        expr: |
          (sum(increase(usage_invoices_payment_status_transitions_total{from="processing",to="paid"}[30m])) == 0)
          and
          (sum(increase(usage_invoices_payment_status_transitions_total{from="processing"}[30m])) > 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No processing→paid conversions while processing transitions exist"
          description: "processing→paid == 0 for 30m, but processing→* > 0"

      - alert: UsageInvoiceFailedSpikeByProvider
        expr: sum(rate(usage_invoices_payment_status_transitions_total{to="failed",provider!="unknown"}[10m])) by (provider) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Invoice failures spike by provider"
          description: "failed transitions rate > 0.5/s per provider over 10m"

      # SLO pack v1: % invoices paid within 5 minutes (300s), target 99% (error budget 1%).
      # burn_rate = error_rate / error_budget = (1 - good/total) / 0.01

      - alert: BillingSLOTimeToPaidFastBurn
        expr: |
          (
            (
              (1 - (billing:sli_time_to_paid_good_rate5m / clamp_min(billing:sli_time_to_paid_total_rate5m, 1e-9)))
              / 0.01
            ) > 14
          )
          and on(provider)
          (
            (
              (1 - (billing:sli_time_to_paid_good_rate1h / clamp_min(billing:sli_time_to_paid_total_rate1h, 1e-9)))
              / 0.01
            ) > 14
          )
          and on(provider) (billing:sli_time_to_paid_total_rate5m > 0.01)
          and on(provider) (billing:sli_time_to_paid_total_rate1h > 0.01)
        for: 5m
        labels:
          severity: page
          service: billing
          slo: time_to_paid_5m
        annotations:
          summary: "Fast SLO burn: time-to-paid ≤ 5m (provider={{ $labels.provider }})"
          description: "Burn rate > 14 on 5m and 1h windows (SLO=99% within 300s)."

      - alert: BillingSLOTimeToPaidSlowBurn
        expr: |
          (
            (
              (1 - (billing:sli_time_to_paid_good_rate30m / clamp_min(billing:sli_time_to_paid_total_rate30m, 1e-9)))
              / 0.01
            ) > 2
          )
          and on(provider)
          (
            (
              (1 - (billing:sli_time_to_paid_good_rate6h / clamp_min(billing:sli_time_to_paid_total_rate6h, 1e-9)))
              / 0.01
            ) > 2
          )
          and on(provider) (billing:sli_time_to_paid_total_rate30m > 0.01)
          and on(provider) (billing:sli_time_to_paid_total_rate6h > 0.01)
        for: 30m
        labels:
          severity: ticket
          service: billing
          slo: time_to_paid_5m
        annotations:
          summary: "Slow SLO burn: time-to-paid ≤ 5m (provider={{ $labels.provider }})"
          description: "Burn rate > 2 on 30m and 6h windows (SLO=99% within 300s)."

