# Ruff configuration for Agent Platform / CyberPlat
# See https://docs.astral.sh/ruff/configuration/

line-length = 100
target-version = "py312"

# Exclude directories
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
]

# Lint configuration
[lint]
# Минимальный набор правил для инкрементальной чистки:
# - блокирует новые критичные ошибки (undefined names / синтаксис)
# - не требует рефакторинга всего legacy-кода сразу
select = ["E9", "F821", "F822", "F823"]

# Ignore specific rules if needed
ignore = ["E501"] # line too long (handled by formatter)

# Per-file ignores
[lint.per-file-ignores]
"tests/*" = [
    "F401",  # unused imports (common in tests)
]
