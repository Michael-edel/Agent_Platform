<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tenant Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: bold; }
        .card { margin-bottom: 1rem; }
        .status-ok { color: #198754; }
        .status-degraded { color: #dc3545; }
        .status-unknown { color: #6c757d; }
    </style>
</head>
<body class="bg-light">
    {% block navbar %}
    {% if tenant_id %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/tenant/">Tenant Portal</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/tenant/">Dashboard</a>
                <a class="nav-link" href="/tenant/usage">Usage</a>
                <a class="nav-link" href="/tenant/subscription">Subscription</a>
                <a class="nav-link" href="/tenant/help">Help</a>
            </div>
            <div class="navbar-text text-white me-3">
                <small>{{ tenant_id }} ({{ prefix }}...)</small>
            </div>
            <form action="/tenant/logout" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </nav>
    {% endif %}
    {% endblock %}
    
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
