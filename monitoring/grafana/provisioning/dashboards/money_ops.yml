apiVersion: 1

providers:
  - name: 'Money Ops Dashboards'
    orgId: 1
    folder: 'Money Ops'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/money_ops
      foldersFromFilesStructure: true
