name: Smoke E2E (docker compose)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from .env.example
        run: |
          cp .env.example .env
          # Override with CI-specific values
          echo "OPENAI_API_KEY=dummy-key-for-ci" >> .env
          echo "DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agent_platform" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "DEBUG=0" >> .env
          echo "BILLING_ENABLED=1" >> .env
          echo "DEMO_BOOTSTRAP_ENABLED=true" >> .env
          # Smoke uses unauthenticated demo requests; production keeps AUTH_ENABLED=true.
          echo "AUTH_ENABLED=false" >> .env

      - name: Build and start docker compose
        run: |
          docker compose up -d --build

      - name: Wait for /health
        run: |
          set -e
          for i in {1..60}; do
            code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)"
            if [ "$code" = "200" ]; then
              echo "OK: /health is ready"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: /health did not become ready"
          exit 1

      - name: Run security and smoke tests in test container
        run: |
          docker compose run --rm --no-deps -e E2E_SMOKE_ENABLED=1 -e E2E_BASE_URL=http://app:8000 app-test python -m pytest -q tests/test_auth_rbac_audit.py tests/smoke/test_demo_e2e.py

      - name: Dump docker logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color app
          docker compose logs --no-color postgres

      - name: Shutdown
        if: always()
        run: |
          docker compose down -v
