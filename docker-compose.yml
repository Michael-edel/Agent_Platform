version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-platform-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agent_platform}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      # Открываем порт только для dev/staging (в production можно убрать)
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-platform-app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Переопределение критичных переменных через environment (приоритет над .env)
      - PLATFORM_DB_PATH=${PLATFORM_DB_PATH:-platform.db}
      # DATABASE_URL для PostgreSQL (если используется)
      - DATABASE_URL=${DATABASE_URL:-}
      # PostgreSQL connection params (для формирования DATABASE_URL)
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-agent_platform}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      # Volume для данных (БД, кэш, временные файлы)
      # В production с PostgreSQL эти volumes могут не использоваться для БД
      - app-data:/app/data
      - app-out:/app/out
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Лимиты ресурсов (опционально, для production)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-platform-worker
    command: ["python", "-m", "cyberplat.billing.worker"]
    env_file:
      - .env
    environment:
      - PLATFORM_DB_PATH=${PLATFORM_DB_PATH:-platform.db}
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-agent_platform}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - BILLING_WORKER_INTERVAL_SECONDS=${BILLING_WORKER_INTERVAL_SECONDS:-5}
      - BILLING_WORKER_BATCH_SIZE=${BILLING_WORKER_BATCH_SIZE:-50}
      - BILLING_WORKER_JITTER_SECONDS=${BILLING_WORKER_JITTER_SECONDS:-0}
      - BILLING_WORKER_ID=${BILLING_WORKER_ID:-}
      - BILLING_WORKER_METRICS_ENABLED=${BILLING_WORKER_METRICS_ENABLED:-true}
      - BILLING_WORKER_METRICS_HOST=${BILLING_WORKER_METRICS_HOST:-0.0.0.0}
      - BILLING_WORKER_METRICS_PORT=${BILLING_WORKER_METRICS_PORT:-9101}
    expose:
      - "9101"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app-data:/app/data
      - app-out:/app/out

  prometheus:
    image: prom/prometheus
    container_name: agent-platform-prometheus
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/alerts/prometheus_billing_worker_rules.yml:/etc/prometheus/rules/billing_worker_rules.yml:ro
      - ./docs/alerts/prometheus_billing_sla_rules_v2.yml:/etc/prometheus/rules/billing_sla_rules_v2.yml:ro
      - ./docs/alerts/prometheus_billing_slo_recording_rules.yml:/etc/prometheus/rules/billing_slo_recording_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.path=/prometheus
    depends_on:
      - app
      - worker
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: agent-platform-grafana
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: agent-platform-app-test
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-agent_platform}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - DATABASE_URL=${DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]
    profiles: ["test"]

volumes:
  app-data:
    driver: local
  app-out:
    driver: local
  pg-data:
    driver: local
  prometheus-data:
    driver: local
